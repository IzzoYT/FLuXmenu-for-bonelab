name: Discord Release Announcement

on:
  release:
    types: [published]

jobs:
  announce:
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord announcement
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request

          webhook = os.environ["DISCORD_WEBHOOK"]

          release_name = os.environ.get("RELEASE_NAME") or os.environ["RELEASE_TAG"]
          tag = os.environ["RELEASE_TAG"]
          url = os.environ["RELEASE_URL"]
          body = os.environ.get("RELEASE_BODY", "")

          if len(body) > 3000:
              body = body[:2997] + "..."

          data = {
              "username": "FLuX Core",
              "embeds": [
                  {
                      "title": f"⚡ FLuX Core Update — {release_name}",
                      "description": body or "A new FLuX Core update is available.",
                      "url": url,
                      "color": 15844367,
                      "fields": [
                          {
                              "name": "Version",
                              "value": tag,
                              "inline": True
                          },
                          {
                              "name": "Repository",
                              "value": "[View on GitHub](%s)" % url,
                              "inline": True
                          }
                      ],
                      "footer": {
                          "text": "FLuX Core • GitHub Release"
                      }
                  }
              ]
          }

          req = urllib.request.Request(
              webhook,
              data=json.dumps(data).encode(),
              headers={
                  "Content-Type": "application/json"
              }
          )

          urllib.request.urlopen(req)
          PY